global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "/etc/prometheus/alert-rules.yml"
  - "/etc/prometheus/recording-rules.yml"
  - "/etc/prometheus/slo-burn-alerts.yml"
  - "/etc/prometheus/autoscaling-alerts.yml"

scrape_configs:
  - job_name: "incident-service"
    static_configs:
      - targets: ["incident-service:8000"]

  - job_name: "api-gateway"
    static_configs:
      - targets: ["api-gateway:8080"]

  - job_name: "health-service"
    static_configs:
      - targets: ["health-service:8001"]

  - job_name: "order-service"
    static_configs:
      - targets: ["order-service:8002"]

  - job_name: "auth-service"
    static_configs:
      - targets: ["auth-service:8003"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "redis-exporter"
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: "mongodb-exporter"
    static_configs:
      - targets: ["mongodb-exporter:9216"]

  - job_name: "nats-exporter"
    static_configs:
      - targets: ["nats-exporter:7777"]

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
