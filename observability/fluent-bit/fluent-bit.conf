[SERVICE]
    Flush         5
    Daemon        off
    Log_Level     info

[INPUT]
    Name              tail
    Path              /var/log/*.log
    Parser            docker
    Tag               platform.*

[FILTER]
    Name              record_modifier
    Match             *
    Record            platform cloud-native-incident-platform

[OUTPUT]
    Name              loki
    Match             *
    Host              loki
    Port              3100
    Labels            job=fluent-bit
    Auto_Kubernetes_Labels off
