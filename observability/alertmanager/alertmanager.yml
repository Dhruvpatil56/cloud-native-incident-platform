global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "severity"]
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: "incident-service-webhook"

receivers:
  - name: "incident-service-webhook"
    webhook_configs:
      - url: "http://incident-service:8000/webhook/alertmanager"
        send_resolved: false

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname"]
