[project]
name = "incident-pipeline"
version = "0.1.0"
description = "Incident processing pipeline with RCA enforcement, debouncing, and caching"
requires-python = ">=3.12"
dependencies = [
    "redis>=5.0",
    "psycopg2-binary>=2.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi==0.115.6",
    "uvicorn==0.30.0",
    "httpx>=0.28",
    "nats-py>=2.9",
    "motor>=3.6",
    "slowapi>=0.1.9",
    "aiosmtplib>=3.0",
    "prometheus-client>=0.20",
    "opentelemetry-sdk==1.26.0",
    "opentelemetry-api==1.26.0",
    "opentelemetry-exporter-otlp==1.26.0",
    "opentelemetry-instrumentation-fastapi==0.47b0",
    "opentelemetry-instrumentation-requests==0.47b0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "fakeredis>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
