apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-stack
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://gitlab.com/Dhruvpatil56/cloud-native-incident-platform.git
    targetRevision: main
    path: infrastructure/kubernetes/base/observability

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
