apiVersion: v1
kind: ConfigMap
metadata:
  name: health-service-config
  namespace: platform
data:
  ENV: "production"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-service
  namespace: platform
  labels:
    app: health-service
    version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: health-service
  template:
    metadata:
      labels:
        app: health-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: health-service
          image: dhruvpatil56/cnip-health-service:latest
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: health-service-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: health-service
  namespace: platform
  labels:
    app: health-service
spec:
  selector:
    app: health-service
  ports:
    - name: http
      port: 8001
      targetPort: 8001
  type: ClusterIP
