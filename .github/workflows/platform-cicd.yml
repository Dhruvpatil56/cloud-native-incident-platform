name: Platform CI/CD

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_TAG: latest

jobs:

  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - incident-service
          - aiops-engine
          - api-gateway
          - health-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${IMAGE_TAG} \
            ./services/${{ matrix.service }}

      - name: Push Docker image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${IMAGE_TAG}

  smoke-test:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Create Kind cluster
        uses: helm/kind-action@v1

      - name: Verify cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Deploy namespaces
        run: |
          kubectl apply -f infrastructure/kubernetes/base/namespaces.yaml

      - name: Deploy infrastructure
        run: |
          kubectl apply -f infrastructure/kubernetes/base/databases.yaml
          kubectl apply -f infrastructure/kubernetes/base/observability/

      - name: Wait for infrastructure readiness
        run: |
          kubectl wait --for=condition=ready pod \
            -l app=postgres \
            -n platform \
            --timeout=180s

          kubectl wait --for=condition=ready pod \
            -l app=redis \
            -n platform \
            --timeout=180s

          kubectl wait --for=condition=ready pod \
            -l app=nats \
            -n platform \
            --timeout=180s

      - name: Run database migrations
        run: |
          kubectl apply -f infrastructure/kubernetes/base/jobs/

          kubectl wait --for=condition=complete \
            job/incident-db-migration \
            -n platform \
            --timeout=180s

      - name: Deploy platform services
        run: |
          kubectl apply -f infrastructure/kubernetes/base/services/incident-service.yaml
          kubectl apply -f infrastructure/kubernetes/base/services/aiops-engine.yaml
          kubectl apply -f infrastructure/kubernetes/base/services/api-gateway.yaml
          kubectl apply -f infrastructure/kubernetes/base/services/health-service.yaml

      - name: Wait for service readiness
        run: |
          kubectl wait --for=condition=ready pod \
            -l app=incident-service \
            -n platform \
            --timeout=180s

          kubectl wait --for=condition=ready pod \
            -l app=aiops-engine \
            -n platform \
            --timeout=180s

      - name: Port forward incident-service
        run: |
          kubectl port-forward svc/incident-service 8000:8000 -n platform &
          sleep 15

      - name: Cleanup previous incidents
        run: |
          bash scripts/cleanup-incidents.sh

      - name: Run smoke test
        env:
          WEBHOOK_URL: http://localhost:8000/webhook/alertmanager
          API_URL: http://localhost:8000/api/v1/incidents
        run: |
          bash scripts/fire-incident.sh

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "========== INCIDENT SERVICE LOGS =========="
          kubectl logs deployment/incident-service -n platform || true

          echo "========== AIOPS ENGINE LOGS =========="
          kubectl logs deployment/aiops-engine -n platform || true

          echo "========== NATS LOGS =========="
          kubectl logs deployment/nats -n platform || true

          echo "========== POSTGRES LOGS =========="
          kubectl logs deployment/postgres -n platform || true

          echo "========== REDIS LOGS =========="
          kubectl logs deployment/redis -n platform || true
