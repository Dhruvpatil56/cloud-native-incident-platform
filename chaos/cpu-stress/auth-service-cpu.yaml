apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: auth-service-cpu-hog
  namespace: litmus

spec:
  appinfo:
    appns: platform
    applabel: "app=auth-service"
    appkind: deployment

  chaosServiceAccount: litmus-admin

  experiments:
    - name: pod-cpu-hog

      spec:
        components:
          env:
            - name: CPU_CORES
              value: "1"

            - name: TOTAL_CHAOS_DURATION
              value: "60"
